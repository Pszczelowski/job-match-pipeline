resolver:                       # goal.md 5.1a: find the complete description of a job that came without one (LinkedIn alerts)
  # OFF until you switch it on. Only the sources listed below are ever asked (this is the allowlist of hosts); robots.txt of
  # the host is read and respected first, including its crawl-delay; the run stops at the first 403, 429, 5xx or network error.
  # permission_note decides the tier: a source WITH a note (who allowed what, when) is tier T1 (permitted); a source WITHOUT
  # a note is tier T2 (the site's terms may forbid automated access) and is used only while accept_t2_risk is true, which
  # is your own decision (goal.md 5.1a, 3 Nov 2026). Never evades bot protection or a login wall.
  enabled: false
  accept_t2_risk: false
  delay_seconds: 5              # pause between two requests to a host (at least the host's robots.txt crawl-delay)
  daily_cap_per_host: 60        # at most this many job attempts per host and day
  max_attempt_days: 7           # a job is given up on after this many days with an attempt and no success
  timeout_seconds: 30
  user_agent: ""                # empty: the same as descriptions.user_agent
  discovery:                    # goal.md 5.1a (a), v0.73.0: look for the same job (company + title) on the public job board of the company
    enabled: false              # OFF until you have seen `resolve-descriptions --discovery --dry-run`; runs in `prepare` when true
    window_days: 120            # only jobs first seen within this many days are looked up (1 to 365)
    platforms: [greenhouse, ashby, lever]   # public job-board interfaces to guess board names on (greenhouse, ashby, lever)
    local_twins: true           # copy the text of an open job of the same company that has a complete description and a close title
    new_companies_per_day: 10   # at most this many companies get new board-name guesses per day (1 to 50)
    miss_retry_days: 30         # a guess that found no board is asked again after this many days (1 to 365), at most 4 times
  sources:                      # key -> platform (jibe, refline, liebherr or jobcloud), base_url, aliases (company names as the alert gives them)
    axa:                        # AXA Switzerland, careers.axa.com (iCIMS / Jibe, public JSON list with the full text)
      platform: jibe
      base_url: "https://careers.axa.com"
      list_url: ""              # optional: another address for the list (default: base_url + /api/jobs)
      aliases: ["AXA", "AXA Switzerland", "AXA Versicherungen"]
      permission_note: ""
    zkb:                        # Zuercher Kantonalbank, apply.refline.ch (list page, schema.org JobPosting on each job page)
      platform: refline
      base_url: "https://apply.refline.ch/792841"
      list_url: ""              # optional: another address for the list (default: base_url + /search.html)
      aliases: ["Zürcher Kantonalbank", "ZKB"]
      permission_note: ""
    liebherr:                   # Liebherr, www.liebherr.com/de-ch/karriere (server-rendered search page, schema.org JobPosting on each job page)
      platform: liebherr
      base_url: "https://www.liebherr.com"
      list_url: ""              # optional: another address for the search page (default: base_url + /de-ch/karriere/offene-stellen-3360980)
      aliases: ["Liebherr", "Liebherr Group", "Liebherr-International AG"]
      permission_note: ""
    jobcloud:                   # jobs.ch job board (JobCloud): search page + schema.org JobPosting on the job page; job pages only, never the API
      platform: jobcloud
      base_url: "https://www.jobs.ch"
      list_url: ""              # optional: another search page (default: base_url + /en/vacancies/)
      any_company: true         # lists many employers: tried after the employer's own source failed or when none matches; only the job's company counts
      aliases: []
      permission_note: ""
    jobup:                      # jobup.ch, the French-Swiss site of the same board (one host per source)
      platform: jobcloud
      base_url: "https://www.jobup.ch"
      list_url: ""              # optional: another search page (default: base_url + /fr/emplois/)
      any_company: true
      aliases: []
      permission_note: ""

web:                            # goal.md 5.7, 5.9a: `python -m app web`; on the PC without a login, in the NAS container with one
  host: "127.0.0.1"             # 127.0.0.1, localhost or ::1 only (the --host flag too); the container binds 0.0.0.0 by container_bind
  port: 8000                    # 1 to 65535
  # NAS container only (v0.74.0). container_bind true makes the web app listen on 0.0.0.0 INSIDE the container; it starts only when
  # all four hold: env RECRUITMENT_CONTAINER=1 (the Dockerfile sets it), allowed_hosts not empty, login.username not empty,
  # RECRUITMENT_WEB_PASSWORD_HASH in .env (make it with `python -m app set-web-password`). Otherwise it refuses to start.
  container_bind: false
  allowed_hosts: []             # the Host names served besides 127.0.0.1/localhost/::1, e.g. ["100.64.1.2"] (the ZeroTier address of the NAS)
  login:
    username: ""                # empty: no login (the PC default). Set: login required (also on the PC), hash from RECRUITMENT_WEB_PASSWORD_HASH
    stay_days: 90               # 1 to 90 (default 90 since v0.76.0): how long "stay logged in" lasts, counted from the login; without it the session ends with the browser, at most 12 hours

schedule:                       # goal.md 5.9: `python -m app schedule`, the daily run inside the container (Phase 5)
  enabled: false                # off by default; true: prepare runs every day at prepare_time, then backup
  prepare_time: "06:30"         # HH:MM wall-clock time in `timezone` (Europe/Zurich, so daylight saving time is followed)
  run_backup: true              # run `backup` right after `prepare` (also when prepare failed); `finish` is never scheduled unless `headless.enabled`

headless:                       # goal.md 5.10 (v0.78.0): the scoring, letter and review roles run as headless Claude Code in the `llm` service. Read by the scheduler only
  enabled: false                # off by default (human-only switch). true: prepare, backup, then a request for the llm service, finish when it is done
  max_wait_minutes: 270         # the scheduler waits this long for the llm service; must be below 300 (STEP_TIMEOUT_SECONDS is 5 hours)
  poll_seconds: 20              # how often the scheduler looks for the done file (it touches its heartbeat on every look)
  retry_after_limit: true       # a usage limit stops the chain; true: one more run after the reset time is read from the limit message
  retry_latest: "20:00"         # HH:MM local time; a reset later than this means no retry today
  retry_fallback_minutes: 300   # wait this long when the reset time cannot be read from the message (5 hours)
  resume_attempts: 2            # unfinished CVs or letters of a run are tried this many more times, then the run is marked failed
  roles:                        # full model ids, never aliases; timeouts and turns are first guesses (measured in T-HL-M)
    scorer:
      model: claude-sonnet-5-5
      effort: medium            # low, medium, high, xhigh or max
      timeout_minutes: 150
      max_turns: 300
    letters:
      model: claude-sonnet-5-5
      effort: medium
      timeout_minutes: 45
      max_turns: 120
    review:
      model: claude-opus-5-5
      effort: low
      timeout_minutes: 45
      max_turns: 120
  revision:                     # "Ask the writer to fix" on a blocked document (v0.85.0, goal.md 5.10a): one writer call and one reviewer call
    wait_minutes: 75            # the scheduler waits this long for the done file of a revision (first guess); at least 2 x timeout_minutes + 15
    quiet_minutes: 60           # no request is sent this long before the next daily prepare or retry (the daily chain goes first)
    timeout_minutes: 20         # each of the two roles (first guess, measured in T-HL-M9)
    max_turns: 40

monitoring:                     # goal.md 5.9
  zero_jobs_alert_after: 3      # warn when this many alert mails in a row had no jobs, or an employer adapter read nothing or failed this many runs in a row
  lock_stale_hours: 6           # a run lock older than this is treated as left over from a crash
  alerts: true                  # e-mail when a run or the backup fails, an adapter returns no jobs again and again, or the Gmail login is refused;
                                # false: alerts are still recorded (`status` lists them) but nothing is sent
