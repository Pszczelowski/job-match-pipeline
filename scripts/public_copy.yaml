# Rules of the public portfolio copy (goal.md 7.4 "Public portfolio copy", v0.95.0). Read by scripts/build_public_copy.py.
# This file holds no private value. Real names, addresses and the like live in the untracked scripts/public_copy.local.yaml
# (keys: scripts/public_copy.local.example.yaml).
#
# A path is copied when an `include` glob matches it and no `exclude` glob does. Glob syntax: a pattern without "/" matches the
# file name at any depth, a pattern ending in "/" matches a folder from the top, "**" crosses folders, "*" does not.

include:
  - app/
  - tests/
  - prompts/
  - scripts/
  - .claude/agents/
  - docs/
  - README.md
  - site/
  - Dockerfile
  - compose.yaml
  - "*.example*"
  - "requirements*.txt"
  - pytest.ini
  - .gitignore
  - .dockerignore
  - .github/dependabot.yml

# Every exclude names its reason. `except` lists globs that stay copied although the exclude matches (the *.example templates).
exclude:
  - {glob: config.yaml, reason: "the owner's real configuration"}
  - {glob: ".env*", except: ["*.example"], reason: "secret files (mail app password)"}
  - {glob: llm.env, reason: "the Claude login line of the llm service"}
  - {glob: compose.env, reason: "the owner's real compose settings (NAS paths, addresses)"}
  - {glob: "*.db*", reason: "database files hold real jobs and personal data"}
  - {glob: data/, reason: "runtime data"}
  - {glob: exchange/, reason: "batch and results files with real jobs"}
  - {glob: output/, reason: "generated CVs and letters of a real person"}
  - {glob: backups/, reason: "database backups"}
  - {glob: logs/, reason: "logs with personal data"}
  - {glob: profile/, reason: "the real CV; the fictional persona of examples/persona/ takes its place"}
  - {glob: examples/, reason: "the persona is placed at profile/ by the build, not copied under its own name"}
  - {glob: goal.md, reason: "private specification and decision log"}
  - {glob: CHANGELOG.md, reason: "private history of the owner's own pipeline"}
  - {glob: CLAUDE.md, reason: "private working instructions"}
  - {glob: session.md, reason: "private session notes"}
  - {glob: DEPLOYMENT_MANUAL.md, reason: "the owner's NAS deployment with real addresses"}
  - {glob: reports/, reason: "private phase reports"}
  - {glob: .github/workflows/, reason: "release and CI workflows of the private repository (billing, tokens, release tags)"}
  - {glob: .gitattributes, reason: "not needed in the copy"}
  - {glob: docs/DEVELOPMENT.md, reason: "private development log, cites real addresses and goal.md numbers"}
  - {glob: docs/SCORING.md, reason: "private scoring runbook of the owner's daily routine"}
  - {glob: docs/TEST_CASES.md, reason: "private test log with real addresses and run notes (large)"}
  - {glob: "**/__pycache__/**", reason: "bytecode"}
  - {glob: .claude/worktrees/, reason: "agent worktrees"}
  - {glob: web/, reason: "the owner's landing page (v0.101.0): personal timeline and portrait, built from the real profile"}
  - {glob: tests/test_landing_build.py, reason: "reads profile/public_cv.yaml, profile/landing.yaml and the real master_cv.yaml, which are not copied"}
  - {glob: profile/landing.yaml, reason: "the owner's landing-page content"}
  - {glob: profile/public_cv.yaml, reason: "the owner's public CV selection"}
  # test files that cannot run in a copy without the private files they read (each names what it needs)
  - {glob: tests/test_ci_workflow.py, reason: "reads .github/workflows/ci.yml, which is not copied"}
  - {glob: tests/test_deployment.py, reason: "reads the release and version-check workflows and DEPLOYMENT_MANUAL.md, which are not copied"}

# The few binary files that may be copied. Anything else binary is a scan finding.
binary_allow:
  - "app/fonts/*.ttf"
  - profile/photo.jpg
  - "docs/assets/*.png"     # README screenshots of the demo database (fictional jobs)

# Files whose text keeps its real values (the author's name shows in the README and the license).
replace_skip_paths: [README.md, LICENSE, "site/*", tests/test_freeze_demo.py]   # it checks the landing page links, which keep the name
denylist_exempt_paths: [README.md, LICENSE, "site/*", tests/test_freeze_demo.py]

# The fictional persona: examples/persona/<file> is written to profile/<file> of the copy (tracked, values-free).
persona: {source: examples/persona/, target: profile/}

private_block:
  start: "<!-- private:start -->"
  end: "<!-- private:end -->"
  skip_paths: [scripts/, tests/test_public_copy.py]          # they quote the markers

# Edits that hold no private value (the real ones are in the local file). Tried in order, then the local ones.
replacements:
  - {find: " · LinkedIn <!-- TODO linkedin url -->", replace: "", paths: [README.md]}
  - {find: " The full procedure, with the web service, the `llm` profile and the NAS notes, is in `DEPLOYMENT_MANUAL.md`.", replace: "", paths: [README.md]}

