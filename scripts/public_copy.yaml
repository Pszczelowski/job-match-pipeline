# --- the scan -------------------------------------------------------------------------------------------------------------
# Addresses that are not personal: public no-reply senders the adapters match on, and test senders.
email_allow:
  - noreply.hrconnect@juliusbaer.com
  - noreply@juliusbaer.com
  - other@juliusbaer.com
  - jobmail@jobs.ch
  - noreply@jobs.ch
  - other@jobs.ch
  - jobalerts-noreply@linkedin.com
  - other@linkedin.com
  - invitations@linkedin.com
  - agentserver@ent.brassring.com
# Domains that never count (RFC 2606 / 6761 names).
email_domain_allow: [example.com, example.org, example.net, example, test, invalid, localhost]
# IPv4 values that are made up in tests (127.0.0.1, 0.0.0.0 and the RFC 5737 blocks are always allowed).
ip_allow: [1.1.1.1, 1.2.3.4, 2.2.2.2, 3.3.3.3, 7.7.7.7, 9.9.9.9, 10.0.0.1, 10.0.0.5, 10.0.1.1, 10.9.9.9, 100.64.1.2, 100.64.1.3,
           192.168.0.10, 192.168.1.5, 2.3.1.2, 2.3.1.3]       # the last two are RFC 9309 section numbers
# Phone-like values that are made up (digits only). Numbers ending in seven zeros or 1234567 always pass.
phone_allow: ["41791112233"]
# Known false positives: path, the sha256 prefix (10 hex) of the stripped line, the rule. The finding line prints the hash.
scan_allow: []
# Third-party files that are not scanned for patterns (they are still checked for the denylist).
scan_skip_patterns: ["app/static/vendor/*", "demo/static/vendor/*"]
# A secret-shaped match that contains one of these words is a made-up value of a test, not a secret.
placeholder_words: [made-up, abcdef, abcd efgh ijkl mnop, fake, dummy, example]
