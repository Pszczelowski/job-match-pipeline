# Master CV fact file of the fictional demo persona "Alex Morgan" (examples/persona/).
#
# Every name, employer, e-mail address, phone number and date in this file is made up. The build of the public copy
# (scripts/build_public_copy.py) places this folder at profile/ of the copy so that the app and its tests run without
# any real person's data. Structure, fact ids and keys follow the real fact file (goal.md 5.4, 5.6).
#
# Rules
#   1. Every fact has a stable id. Ids are never reused or renumbered.
#   2. `texts` holds the bullet wording per CV variant; a key is missing when that CV does not contain the bullet.
#   3. `numbers` lists every figure that appears in the bullet; the traceability check compares generated documents
#      against these.
#   4. Tailoring may reorder, select and rephrase. It may not add employers, titles, dates, skills, numbers or
#      certificates that are not in this file.
#   5. Status words: `in_progress`, `in_preparation` (a certificate only prepared for), `not_completed` and `completed`.

