# Vocabulary of the traceability check (goal.md 5.6, app/traceability.py).
# Data, not code: extend these lists when a fake fact slips through or a real one is flagged.
# Everything here only DETECTS candidates; whether a candidate is allowed is decided from
# profile/master_cv.yaml (and profile/variants.yaml) plus the employer the caller passes in.

