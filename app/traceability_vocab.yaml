# A certificate that the fact file lists as not obtained is only allowed in a block that says so.
preparation_words: [prepar, in progress, working towards, pursuing, studying, currently, upcoming, planning to, aiming]

# Employer aliases: key = employer name as written in profile/master_cv.yaml (ignored when it is
# not there), values = other ways to write the same employer. "CS" is deliberately not an alias
# for Fabrikam (two letters, too ambiguous; spell it out).
employer_aliases:
  "Contoso Fund Services": [Contoso]
  "Litware Limited for Adventure Works Poland": [Litware, Adventure Works, Adventure Works Poland, Litware Limited]
  "Northwind": [Northwind AG, Northwind Group]
  "Fabrikam": [Fabrikam AG, Fabrikam Group]

# Organisations that are detected on sight (case-insensitive when they have several words,
# case-sensitive when they have one). Allowed only when they are a fact-file employer or the
# target employer passed by the caller. Product vendors (Microsoft, Google, Oracle...) are left
# out on purpose: "Microsoft Excel" is a tool, and "at Google" is caught by the "at X" rule.
