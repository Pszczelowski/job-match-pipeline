# Last word of an organisation-like capitalised phrase ("Acme Holding", "Foo Capital Partners").
org_suffixes: [AG, SA, GmbH, Ltd, Limited, Inc, LLC, plc, Corp, Corporation, Bank, Group, Holding, Holdings, Partners, Capital, Insurance, Services, Solutions, Technologies, Systems, Consulting, Labs, Industries, Pharma, Foundation, Institute, University, Company, Fund, Funds, Assurance, Trust, Advisors, Associates]

# Dropped when two organisation names are compared ("SIX Group AG" = "SIX").
legal_suffixes: [ag, sa, gmbh, ltd, limited, inc, llc, plc, corp, corporation, co, group, holding, holdings, the]

# Places are never organisations in the "at X" rule.
locations: [Zurich, Zürich, Wroclaw, Wrocław, Switzerland, Poland, Basel, Geneva, Bern, Lausanne, Lugano, Zug, Winterthur, Lucerne, Vaduz, Liechtenstein, Warsaw, Krakow, London, Frankfurt, Berlin, Remote, Europe, EMEA, Germany, Austria, Singapore]

# Words that end a job title ("Senior Business Analyst").
role_nouns: [Analyst, Engineer, Manager, Developer, Tester, Specialist, Officer, Consultant, Architect, Lead, Director, Head, Owner, Designer, Scientist, Administrator, Coordinator, Associate, Intern, Trainee, Assistant, Executive, Programmer, Planner, Controller, Auditor, Advisor, Adviser, President]

# Adjectives that may stand in front of a title without being part of it ("an experienced Business Analyst").
title_prefix_ignore: [as, experienced, skilled, dedicated, proven, motivated, passionate, former, previous, current, hands-on, reliable, detail-oriented, seasoned, accomplished]

# Acronyms and camel-case words that are not skills. Any other all-caps acronym or camel-case word
# that is not in the fact files is a finding (kind "skill").
neutral_terms: [CV, PDF, USD, EUR, CHF, GBP, PLN, US, UK, EU, CH, PL, DE, AG, SA, OK, ID, FAQ, CEO, CFO, COO, CTO, CIO, HR, PR, AM, PM, LinkedIn, GmbH, EMEA, IT, AI, SaaS, AdTech, FinTech, HNW, UHNW]
