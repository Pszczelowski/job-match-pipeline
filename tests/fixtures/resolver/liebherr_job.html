<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","datePosted":"2026-11-02","description":"<p>Der Business Process Owner (BPO) spielt eine Schlüsselrolle in den strategischen ERP- und CRM-Transformationsprojekten und trägt die durchgängige Verantwortung für definierte Geschäftsprozesse und deren kontinuierliche Weiterentwicklung. Ziel ist die erfolgreiche Einführung und nachhaltige Optimierung standardisierter, digitaler Kundenserviceprozesse in der gesamten internationalen Liebherr-Gruppe.<br>Ein zentraler Erfolgsfaktor dieser Position ist die enge, tägliche Zusammenarbeit mit unseren operativen Geschäftsbereichen. Der BPO arbeitet direkt mit den Kundendienstabteilungen der Geschäftsbereiche und den regionalen Serviceorganisationen zusammen, um sicherzustellen, dass die definierten Prozesse nicht nur zentral konzipiert werden, sondern auch praxisnah und skalierbar sind und sowohl in den regionalen als auch in den zentralen Organisationen fest im Tagesgeschäft verankert sind.</p><h2>Aufgaben:</h2><p>Prozessverantwortung</p><ul><li>Umfassende Verantwortung, Steuerung, Dokumentation und kontinuierliche Verbesserung der zugewiesenen Geschäftsprozesse (z. B. Kundenservice, Ersatzteilverkauf, Marketing, Stammdaten)</li><li>Sicherstellung, dass die Prozessgestaltung die betrieblichen Gegebenheiten, regulatorischen Anforderungen und lokalen Serviceanforderungen widerspiegelt und gleichzeitig globale Standards einhält.</li></ul><p>Enge Zusammenarbeit mit den operativen Bereichen</p><ul><li>Auftreten als vertrauenswürdiger Partner für die operativen Einheiten, um eine enge Abstimmung zwischen der globalen Prozessgestaltung und der lokalen Umsetzung sicherzustellen.</li><li>Regelmäßiger Austausch mit den operativen Kundenservice-Teams, um Feedback einzuholen, Schwachstellen zu identifizieren und operative Anforderungen in skalierbare Prozess- und Systemverbesserungen umzusetzen.</li><li>Unterstützung der Rollout- und Go-Live-Phasen, um eine reibungslose Einführung und Geschäftskontinuität sicherzustellen.</li></ul><p>Anforderungsmanagement</p><ul><li>Erfassung, Bewertung und Priorisierung von Anforderungen aus operativen Bereichen und regionalen Organisationen.</li><li>Umsetzung von Geschäftsanforderungen in IT-taugliche Anforderungen in enger Zusammenarbeit mit Product Ownern und Implementierungspartnern.</li><li>Abwägen zwischen globaler Standardisierung und begründeten lokalen Abweichungen sowie Rückkopplung relevanter lokaler Anforderungen in globale Lösungen.</li></ul><p>Projektbeitrag</p><ul><li>Aktive Teilnahme an allen Projektphasen (Vorstudie, Entwurf, Entwicklung, Rollout, Betrieb).</li><li>Sicherstellung einer nahtlosen Prozessintegration in die Zielsysteme und eines stabilen Übergangs vom Projektmodus in den operativen Einsatz.</li><li>Unterstützung von Lokalisierungsmaßnahmen und Entscheidung darüber, ob Anforderungen global oder lokal umgesetzt werden sollen.</li></ul><h2>Qualifikation:</h2><ul><li>Hochschulabschluss in Betriebswirtschaftslehre, (Wirtschafts-)Informatik, Ingenieurwesen oder eine vergleichbare Qualifikation.</li><li>Mehrjährige Erfahrung im Prozessmanagement, idealerweise im Rahmen internationaler Transformationsprojekte (CRM, ERP oder dienstleistungsbezogene Prozesse).</li><li>Fundierte Fachkenntnisse in der Analyse, Modellierung und Optimierung von durchgängigen Geschäftsprozessen.</li><li>Nachweisbare Erfahrung in der engen Zusammenarbeit mit operativen Geschäftseinheiten, IT-Teams und externen Partnern.</li><li>Hervorragende Kommunikations- und Moderationsfähigkeiten sowie ausgeprägte interkulturelle Kompetenz.</li><li>Hohe Eigeninitiative, Durchsetzungsstärke und eine strukturierte, lösungsorientierte Arbeitsweise.</li><li>Sehr gute Deutsch- und Englischkenntnisse.</li></ul><h2>Unser Angebot:</h2><p>Können wir Sie dazu inspirieren, eine verantwortungsvolle Rolle in einem dynamischen und unabhängigen Familienunternehmen zu übernehmen? Wir bieten Ihnen Gestaltungsfreiheit, einen sicheren Arbeitsplatz sowie fortschrittliche und familienfreundliche Arbeitsbedingungen wie flexible Arbeitszeiten und Weiterbildungsmöglichkeiten.</p><p>Haben wir Ihr Interesse geweckt? Dann freuen wir uns über Ihre Online-Bewerbung. Bei Fragen kontaktieren Sie bitte Regina Abou el Naga.</p><p>Bitte beachten Sie, dass Bewerbungen via E-Mail nicht berücksichtigt werden können.</p><p><strong>One Passion. Many Opportunities.</strong></p>","employmentType":"FULL_TIME","hiringOrganization":{"@type":"Organization","sameAs":"https://www.liebherr.com","logo":"https://www-assets.liebherr.com/media/global/global-media/liebherr_logos/logo_ci_liebherr.svg","name":"Liebherr-International AG"},"identifier":{"@type":"PropertyValue","name":"Liebherr-International AG","value":"34396"},"jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Nussbaumen","postalCode":"5415","addressCountry":"CH"}},"title":"Business Process Owner (BPO) Customer Service (m/w/d)","industry":"Liebherr International","image":"https://assets-cdn.liebherr.com/versions/a48d4204-39ae-4fd6-804b-ec3f2d963a52/original/"}</script></head><body></body></html>
