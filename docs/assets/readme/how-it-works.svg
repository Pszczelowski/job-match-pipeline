<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-label="How it works: 1 Collect every alert, 2 Filter duplicates and deal-breakers, 3 Score each job 0 to 100 with reasons, 4 Top 10 with fact-checked CV and letter">
<style>text{font-family:Montserrat,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1b1b1b}.k{font-size:24px;font-weight:800;letter-spacing:3px;fill:#b63e96}.h{font-size:52px;font-weight:900}.t{font-size:40px;font-weight:800}.b{font-size:29px;font-weight:500;fill:#4a4a4a}.n{font-size:26px;font-weight:800;fill:#b63e96}.big{font-size:64px;font-weight:900;fill:#b63e96}.p{font-size:28px;font-weight:700;fill:#f5f5f5}</style>
<rect width="960" height="820" rx="28" fill="#f5f5f5"/><text x="480" y="56" text-anchor="middle" class="k">HOW IT WORKS</text><text x="480" y="118" text-anchor="middle" class="h">From inbox chaos to a top 10</text>
<rect x="48" y="158" width="872" height="136" rx="26" fill="#1b1b1b"/><rect x="40" y="150" width="872" height="136" rx="26" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<g transform="translate(72,188) scale(2.6)" fill="none" stroke="#b63e96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g><text x="170" y="210" class="t"><tspan class="n">01  </tspan>Collect</text><text x="170" y="254" class="b">Every alert, every board, one place.</text>
<rect x="48" y="318" width="872" height="136" rx="26" fill="#1b1b1b"/><rect x="40" y="310" width="872" height="136" rx="26" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<g transform="translate(72,348) scale(2.6)" fill="none" stroke="#b63e96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></g><text x="170" y="370" class="t"><tspan class="n">02  </tspan>Filter</text><text x="170" y="414" class="b">Duplicates merged, deal-breakers out.</text>
<rect x="48" y="478" width="872" height="136" rx="26" fill="#1b1b1b"/><rect x="40" y="470" width="872" height="136" rx="26" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<g transform="translate(72,508) scale(2.6)" fill="none" stroke="#b63e96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></g><text x="170" y="530" class="t"><tspan class="n">03  </tspan>Score</text><text x="170" y="574" class="b">AI rates each job 0–100 and says why.</text>
<rect x="48" y="638" width="872" height="136" rx="26" fill="#b63e96"/><rect x="40" y="630" width="872" height="136" rx="26" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="2"/>
<g transform="translate(72,668) scale(2.6)" fill="none" stroke="#e58acb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></g><text x="170" y="690" class="t" style="fill:#f5f5f5"><tspan class="n" style="fill:#e58acb">04  </tspan>Top 10</text><text x="170" y="734" class="b" style="fill:#bdbdbd">Plus a fact-checked CV and letter.</text>
