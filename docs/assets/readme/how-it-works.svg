<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="How it works: 1 Collect every alert, 2 Filter duplicates and deal-breakers, 3 Score each job 0 to 100 with reasons, 4 Top 10 with fact-checked CV and letter drafts">
  <style>
    text{font-family:Montserrat,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1b1b1b}
    .k{font-size:13px;font-weight:800;letter-spacing:2px;fill:#b63e96}
    .h{font-size:34px;font-weight:900}
    .n{font-size:13px;font-weight:800;fill:#b63e96}
    .t{font-size:20px;font-weight:800}
    .b{font-size:14px;font-weight:500;fill:#4a4a4a}
    .ic{fill:none;stroke:#b63e96;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="960" height="330" fill="#f5f5f5" rx="24"/>
  <text x="480" y="46" text-anchor="middle" class="k">HOW IT WORKS</text>
  <text x="480" y="88" text-anchor="middle" class="h">From inbox chaos to a top 10</text>
  <g transform="translate(24,120)">
    <rect x="6" y="6" width="190" height="180" rx="22" fill="#1b1b1b"/><rect width="190" height="180" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
    <g transform="translate(22,20) scale(1.6)" class="ic"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></g>
    <text x="22" y="86" class="n">01</text><text x="22" y="112" class="t">Collect</text>
    <text x="22" y="138" class="b">Every alert, every</text><text x="22" y="157" class="b">board, one place.</text>
  </g>
  <path d="M244 210h22m-8-8 8 8-8 8" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(278,120)">
    <rect x="6" y="6" width="190" height="180" rx="22" fill="#1b1b1b"/><rect width="190" height="180" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
    <g transform="translate(22,20) scale(1.6)" class="ic"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></g>
    <text x="22" y="86" class="n">02</text><text x="22" y="112" class="t">Filter</text>
    <text x="22" y="138" class="b">Duplicates merged,</text><text x="22" y="157" class="b">deal-breakers out.</text>
  </g>
  <path d="M498 210h22m-8-8 8 8-8 8" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(532,120)">
    <rect x="6" y="6" width="190" height="180" rx="22" fill="#1b1b1b"/><rect width="190" height="180" rx="22" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
    <g transform="translate(22,20) scale(1.6)" class="ic"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></g>
    <text x="22" y="86" class="n">03</text><text x="22" y="112" class="t">Score</text>
    <text x="22" y="138" class="b">AI rates each job</text><text x="22" y="157" class="b">0–100 and says why.</text>
  </g>
  <path d="M752 210h22m-8-8 8 8-8 8" fill="none" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(784,120)">
    <rect x="6" y="6" width="150" height="180" rx="22" fill="#b63e96"/><rect width="150" height="180" rx="22" fill="#1b1b1b"/>
    <g transform="translate(20,20) scale(1.6)" fill="none" stroke="#e58acb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></g>
    <text x="20" y="86" class="n" style="fill:#e58acb">04</text><text x="20" y="112" class="t" style="fill:#f5f5f5">Top 10</text>
    <text x="20" y="138" class="b" style="fill:#bdbdbd">+ fact-checked</text><text x="20" y="157" class="b" style="fill:#bdbdbd">CV and letter.</text>
  </g>
</svg>
